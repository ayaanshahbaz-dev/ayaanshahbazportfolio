<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0a0b0e" />
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(37,211,102,0.1)" />
      <stop offset="50%" stop-color="rgba(37,211,102,0.8)" />
      <stop offset="100%" stop-color="rgba(59,130,246,0.8)" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad)" />
  <rect width="960" height="540" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- Grid pattern overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="540" />
    <line x1="240" y1="0" x2="240" y2="540" />
    <line x1="360" y1="0" x2="360" y2="540" />
    <line x1="480" y1="0" x2="480" y2="540" />
    <line x1="600" y1="0" x2="600" y2="540" />
    <line x1="720" y1="0" x2="720" y2="540" />
    <line x1="840" y1="0" x2="840" y2="540" />
    <line x1="0" y1="135" x2="960" y2="135" />
    <line x1="0" y1="270" x2="960" y2="270" />
    <line x1="0" y1="405" x2="960" y2="405" />
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="270" r="160" fill="rgba(37,211,102,0.07)" filter="url(#glow)" />
  <circle cx="760" cy="270" r="180" fill="rgba(59,130,246,0.07)" filter="url(#glow)" />

  <!-- Header Badge -->
  <g transform="translate(60, 48)">
    <rect width="280" height="30" rx="15" fill="rgba(37,211,102,0.12)" stroke="rgba(37,211,102,0.3)" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#25D366" />
    <text x="30" y="20" fill="#25D366" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" letter-spacing="2">WHATSAPP OUTREACH PIPELINE</text>
  </g>

  <!-- Title & Meta -->
  <text x="60" y="112" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">End-to-End Outreach &amp; CRM Sync Architecture</text>
  <text x="60" y="132" fill="rgba(255,255,255,0.45)" font-family="'Outfit', sans-serif" font-size="12">Lead Trigger → Template Validation → Webhook Ingestion → CRM Bi-Directional State Machine</text>

  <!-- Connective flow lines -->
  <path d="M 220 280 L 320 280" stroke="url(#lineGrad)" stroke-width="2.5" stroke-dasharray="4 4" />
  <path d="M 460 280 L 560 280" stroke="url(#lineGrad)" stroke-width="2.5" stroke-dasharray="4 4" />
  <path d="M 700 280 L 800 280" stroke="url(#lineGrad)" stroke-width="2.5" stroke-dasharray="4 4" />

  <!-- Node 1: Ingestion & Filter -->
  <g transform="translate(80, 200)">
    <rect width="140" height="160" rx="14" fill="url(#cardGrad)" stroke="rgba(37,211,102,0.25)" stroke-width="1.2" />
    <rect x="14" y="16" width="36" height="36" rx="8" fill="rgba(37,211,102,0.15)" />
    <!-- WhatsApp icon silhouette -->
    <path d="M32 24 C27 24 23 28 23 33 C23 35 24 37 25 39 L24 43 L28 42 C30 43 31 43 32 43 C37 43 41 39 41 34 C41 29 37 24 32 24 Z" fill="#25D366" />
    <text x="14" y="78" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">01. Lead Input</text>
    <text x="14" y="98" fill="rgba(255,255,255,0.4)" font-family="'Outfit', sans-serif" font-size="10">CSV / Webhook / DB</text>
    <text x="14" y="114" fill="rgba(255,255,255,0.4)" font-family="'Outfit', sans-serif" font-size="10">Number Verification</text>
    <text x="14" y="130" fill="rgba(255,255,255,0.4)" font-family="'Outfit', sans-serif" font-size="10">Opt-in Compliance</text>
  </g>

  <!-- Node 2: Sequence Orchestrator -->
  <g transform="translate(320, 200)">
    <rect width="140" height="160" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" />
    <rect x="14" y="16" width="36" height="36" rx="8" fill="rgba(255,255,255,0.08)" />
    <!-- Gear icon -->
    <circle cx="32" cy="34" r="8" fill="none" stroke="#ffffff" stroke-width="2" />
    <text x="14" y="78" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">02. n8n Engine</text>
    <text x="14" y="98" fill="rgba(255,255,255,0.4)" font-family="'Outfit', sans-serif" font-size="10">Cadence Rules (1-3d)</text>
    <text x="14" y="114" fill="rgba(255,255,255,0.4)" font-family="'Outfit', sans-serif" font-size="10">Dynamic Templating</text>
    <text x="14" y="130" fill="rgba(255,255,255,0.4)" font-family="'Outfit', sans-serif" font-size="10">Throttle &amp; Rate Limits</text>
  </g>

  <!-- Node 3: Cloud API Dispatcher -->
  <g transform="translate(560, 200)">
    <rect width="140" height="160" rx="14" fill="url(#cardGrad)" stroke="rgba(59,130,246,0.25)" stroke-width="1.2" />
    <rect x="14" y="16" width="36" height="36" rx="8" fill="rgba(59,130,246,0.15)" />
    <!-- Cloud icon -->
    <path d="M26 36 C24 36 22 34 22 32 C22 30 24 28 26 28 C27 25 30 24 33 24 C36 24 39 26 40 29 C42 29 44 31 44 33 C44 35 42 36 40 36 Z" fill="#3B82F6" />
    <text x="14" y="78" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">03. Cloud API</text>
    <text x="14" y="98" fill="rgba(255,255,255,0.4)" font-family="'Outfit', sans-serif" font-size="10">Meta Cloud Endpoint</text>
    <text x="14" y="114" fill="rgba(255,255,255,0.4)" font-family="'Outfit', sans-serif" font-size="10">Delivery Status Track</text>
    <text x="14" y="130" fill="rgba(255,255,255,0.4)" font-family="'Outfit', sans-serif" font-size="10">Read Receipt Hooks</text>
  </g>

  <!-- Node 4: Bi-Directional CRM Sync -->
  <g transform="translate(800, 200)">
    <rect width="130" height="160" rx="14" fill="url(#cardGrad)" stroke="rgba(168,85,247,0.25)" stroke-width="1.2" />
    <rect x="14" y="16" width="36" height="36" rx="8" fill="rgba(168,85,247,0.15)" />
    <!-- Database / CRM icon -->
    <ellipse cx="32" cy="28" rx="8" ry="3" fill="none" stroke="#A855F7" stroke-width="1.5" />
    <path d="M24 28 v8 c0 2 4 3 8 3 s8 -1 8 -3 v-8" fill="none" stroke="#A855F7" stroke-width="1.5" />
    <text x="14" y="78" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">04. CRM Sync</text>
    <text x="14" y="98" fill="rgba(255,255,255,0.4)" font-family="'Outfit', sans-serif" font-size="10">HubSpot / Sheets</text>
    <text x="14" y="114" fill="rgba(255,255,255,0.4)" font-family="'Outfit', sans-serif" font-size="10">Reply State Machine</text>
    <text x="14" y="130" fill="rgba(255,255,255,0.4)" font-family="'Outfit', sans-serif" font-size="10">Rep Hand-off Alert</text>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(80, 420)">
    <rect width="850" height="60" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
    
    <text x="40" y="36" fill="#25D366" font-family="'Outfit', sans-serif" font-size="16" font-weight="800">98.5%</text>
    <text x="110" y="36" fill="rgba(255,255,255,0.5)" font-family="'Outfit', sans-serif" font-size="11">Delivery Success Rate</text>

    <line x1="280" y1="15" x2="280" y2="45" stroke="rgba(255,255,255,0.08)" />

    <text x="320" y="36" fill="#3B82F6" font-family="'Outfit', sans-serif" font-size="16" font-weight="800">&lt;2.4s</text>
    <text x="385" y="36" fill="rgba(255,255,255,0.5)" font-family="'Outfit', sans-serif" font-size="11">Webhook Ingestion to Send</text>

    <line x1="570" y1="15" x2="570" y2="45" stroke="rgba(255,255,255,0.08)" />

    <text x="610" y="36" fill="#A855F7" font-family="'Outfit', sans-serif" font-size="16" font-weight="800">100%</text>
    <text x="670" y="36" fill="rgba(255,255,255,0.5)" font-family="'Outfit', sans-serif" font-size="11">Bi-Directional CRM State Sync</text>
  </g>
</svg>
